<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1d70b8" rx="80"/>
  
  <!-- House icon -->
  <g transform="translate(256, 256)">
    <!-- Roof -->
    <path d="M -100,-80 L 0,-160 L 100,-80 Z" fill="#ffffff"/>
    <!-- Building -->
    <rect x="-80" y="-80" width="160" height="160" fill="#ffffff"/>
    <!-- Door -->
    <rect x="-30" y="10" width="60" height="70" fill="#1d70b8"/>
    <!-- Windows -->
    <rect x="-60" y="-50" width="35" height="35" fill="#1d70b8"/>
    <rect x="25" y="-50" width="35" height="35" fill="#1d70b8"/>
  </g>
  
  <!-- Plus sign indicator (enhancement) -->
  <circle cx="400" cy="112" r="50" fill="#007054"/>
  <rect x="390" y="82" width="20" height="60" fill="#ffffff" rx="3"/>
  <rect x="370" y="102" width="60" height="20" fill="#ffffff" rx="3"/>
</svg>
